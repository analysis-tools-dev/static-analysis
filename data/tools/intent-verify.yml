description: >-
  Deterministic, zero-LLM CLI that checks whether a repo's source still
  lexically covers the acceptance items in a markdown spec, INTENT.md, or
  handoff doc, returning verified, partial, or missing. A fast guardrail
  for catching spec-vs-code drift before review, release, or handoff.
