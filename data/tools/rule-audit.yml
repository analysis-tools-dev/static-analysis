description: >-
  Static analyzer for AI system prompts. Parses a prompt into normative
  rules and reports contradictions, coverage gaps, priority ambiguities,
  and absolute-rule edge cases. No LLM calls; deterministic pure-Python
  lint with CLI, Python API, and CI exit codes.
