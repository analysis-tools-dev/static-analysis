[workspace]
members = ["render", "pr-check"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98.1"
license = "MIT"
repository = "https://github.com/analysis-tools-dev/static-analysis"
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
askama = "0.16"
chrono = { version = "0.4.45", features = ["serde"] }
pico-args = "0.5"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde-saphyr = { version = "1.3", default-features = false, features = ["deserialize"] }
tokio = { version = "1.53.1", features = ["rt", "macros"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
unimplemented = "deny"
unreachable = "deny"
todo = "warn"
dbg_macro = "warn"
# TLS and target-support compatibility crates intentionally coexist.
multiple_crate_versions = "allow"
module_name_repetitions = "allow"
similar_names = "allow"
too_many_lines = "allow"
