name: PR Check
run-name: "PR Check #${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || github.event.pull_request.number }}"

on:
  pull_request:
    branches: [master]
    paths:
      - "data/tools/**.yml"
      - "ci/**"
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to check"
        required: true
      tool_files:
        description: "Space-separated list of tool YAML files to check (e.g. data/tools/foo.yml)"
        required: true

jobs:
  pr-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Initialize check results
        id: target
        uses: actions/github-script@v8
        env:
          PR_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || github.event.pull_request.number }}
        with:
          script: |
            const fs = require('fs');
            if (!/^[1-9][0-9]*$/.test(process.env.PR_NUMBER)) {
              throw new Error('Invalid PR number');
            }
            const pr = context.payload.pull_request ?? (await github.rest.pulls.get({
              ...context.repo, pull_number: Number(process.env.PR_NUMBER),
            })).data;
            fs.mkdirSync('pr-check-output', { recursive: true });
            fs.writeFileSync('pr-check-output/pr_number.txt', String(pr.number));
            fs.writeFileSync('pr-check-output/head_sha.txt', pr.head.sha);
            fs.writeFileSync('pr-check-output/result.txt', 'failed');
            core.setOutput('head_sha', pr.head.sha);

      - name: Check out PR head for manual runs
        if: github.event_name == 'workflow_dispatch'
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          TOOL_FILES: ${{ inputs.tool_files }}
          HEAD_SHA: ${{ steps.target.outputs.head_sha }}
        run: |
          read -r -a files <<< "$TOOL_FILES"
          [ "${#files[@]}" -gt 0 ]
          for file in "${files[@]}"; do
            [[ "$file" =~ ^data/tools/[a-zA-Z0-9_.-]+\.ya?ml$ ]] || exit 1
          done
          git fetch origin "refs/pull/$PR_NUMBER/head"
          [ "$(git rev-parse FETCH_HEAD)" = "$HEAD_SHA" ]
          git checkout FETCH_HEAD -- "${files[@]}"

      - name: Get changed tool files
        id: changed
        env:
          EVENT_NAME: ${{ github.event_name }}
          TOOL_FILES: ${{ inputs.tool_files }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            FILES="$TOOL_FILES"
          else
            FILES=$(git diff --name-only --diff-filter=A origin/master...HEAD -- 'data/tools/*.yml' 'data/tools/*.yaml' | tr '\n' ' ')
          fi
          FILES=$(echo "$FILES" | xargs)  # trim leading/trailing whitespace
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          echo "has_files=$( [ -n "$FILES" ] && echo true || echo false )" >> "$GITHUB_OUTPUT"

      - name: "Skip: no tool files to check"
        if: steps.changed.outputs.has_files == 'false'
        run: |
          echo "passed" > pr-check-output/result.txt

      - name: Install Rust toolchain
        if: steps.changed.outputs.has_files == 'true'
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.98.0

      - name: Cache cargo registry
        if: steps.changed.outputs.has_files == 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ci/target
          key: pr-check-${{ runner.os }}-${{ hashFiles('ci/Cargo.lock') }}
          restore-keys: |
            pr-check-${{ runner.os }}-

      - name: Build pr-check
        if: steps.changed.outputs.has_files == 'true'
        run: cargo build --release --manifest-path ci/Cargo.toml -p pr-check

      - name: Run pr-check
        if: steps.changed.outputs.has_files == 'true'
        id: run-check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || github.event.pull_request.number }}
          # Both triggers use the artifact path; only pr-comment may post/close.
          COMMENT_OUTPUT_FILE: pr-check-output/comment.md
          TOOL_FILES: ${{ steps.changed.outputs.files }}
        run: |
          read -r -a files <<< "$TOOL_FILES"
          status=0
          ci/target/release/pr-check "${files[@]}" || status=$?
          case "$status" in
            0) echo "passed" > pr-check-output/result.txt ;;
            2) echo "rejected" > pr-check-output/result.txt ;;
            *) echo "failed" > pr-check-output/result.txt ;;
          esac

      - name: Upload check results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-check-output
          path: pr-check-output/

      - name: Fail if checks did not pass
        if: always()
        run: |
          result=$(cat pr-check-output/result.txt 2>/dev/null || echo "failed")
          [ "$result" = "passed" ]
