homepage: "https://squid-protocol.github.io/gitgalaxy/"
description: >-
  Offline static analysis that needs no build, compiler, AST or LLM. Scans a
  whole repository (59 languages, including fixed-format COBOL, JCL, PL/I and
  CICS) and reports per-function structure, call and import graphs, risk
  scores and security findings. Outputs SARIF, a CycloneDX SBOM and a SQLite
  knowledge graph. Runs as a CLI and as a GitHub Action.
