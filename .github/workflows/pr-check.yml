name: PR Check

on:
  pull_request_target:
    branches: [master]
    paths:
      - "data/tools/**.yml"
      - "data/tools/**.yaml"

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      # This job has write permissions. Never check out or execute PR code.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Download new tool entries as data
        id: tools
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/pr-check/data/tools"
          gh api --paginate "repos/$GH_REPO/pulls/$PR_NUMBER/files" \
            --jq '.[] | select(.status == "added") | select(.filename | test("^data/tools/[a-zA-Z0-9_.-]+\\.ya?ml$")) | [.sha, .filename] | @tsv' \
            > "$RUNNER_TEMP/pr-check/tools.tsv"
          while IFS=$'\t' read -r sha file; do
            gh api "repos/$HEAD_REPO/git/blobs/$sha" --jq .content | base64 --decode \
              > "$RUNNER_TEMP/pr-check/$file"
          done < "$RUNNER_TEMP/pr-check/tools.tsv"
          if [ -s "$RUNNER_TEMP/pr-check/tools.tsv" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust toolchain
        if: steps.tools.outputs.found == 'true'
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.98.0

      - name: Build trusted checker
        if: steps.tools.outputs.found == 'true'
        run: cargo build --release --locked --manifest-path ci/Cargo.toml -p pr-check

      - name: Check tool criteria
        if: steps.tools.outputs.found == 'true'
        id: check
        working-directory: ${{ runner.temp }}/pr-check
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMMENT_OUTPUT_FILE: ${{ runner.temp }}/pr-check/comment.md
        shell: bash
        run: |
          shopt -s nullglob dotglob
          files=(data/tools/*.yml data/tools/*.yaml)
          [ "${#files[@]}" -gt 0 ]
          status=0
          "$GITHUB_WORKSPACE/ci/target/release/pr-check" "${files[@]}" || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Check PR is still current
        if: steps.tools.outputs.found == 'true'
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh pr view "$PR_NUMBER" --json state,headRefOid --jq '[.state, .headRefOid] | join(" ")')
          if [ "$current" = "OPEN $HEAD_SHA" ] && [ -s "$RUNNER_TEMP/pr-check/comment.md" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Post or update PR comment
        if: steps.current.outputs.ready == 'true'
        id: comment
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          number: ${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/pr-check/comment.md
          header: pr-check-bot

      - name: Close verified rejections
        if: steps.comment.outcome == 'success' && steps.check.outputs.status == '2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh pr view "$PR_NUMBER" --json state,headRefOid --jq '[.state, .headRefOid] | join(" ")')
          if [ "$current" = "OPEN $HEAD_SHA" ]; then
            gh pr close "$PR_NUMBER"
          fi

      - name: Fail if checks did not pass
        if: steps.tools.outputs.found == 'true'
        env:
          CHECK_STATUS: ${{ steps.check.outputs.status }}
        run: test "$CHECK_STATUS" = '0'
