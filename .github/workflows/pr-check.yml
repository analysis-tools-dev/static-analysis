name: PR Check

on:
  pull_request_target:
    branches: [master]

  workflow_dispatch:
    inputs:
      pr_number:
        description: "Open PR to check (verified failures will be closed)"
        required: true
        type: string

concurrency:
  group: pr-check-${{ inputs.pr_number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-check:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}

    steps:
      - name: Resolve PR for manual run
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo "PR number must be a positive integer" >&2; exit 1; }
          metadata=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER" --jq '
            if .state == "open" and .base.ref == "master" and .head.repo != null then
              "HEAD_SHA=\(.head.sha)\nHEAD_REPO=\(.head.repo.full_name)"
            else error("Expected an open PR targeting master with an accessible source repository") end
          ')
          printf '%s\n' "$metadata" >> "$GITHUB_ENV"

      # Use current trusted code, not the PR's potentially stale base SHA.
      # This job has write permissions. Never check out or execute PR code.
      - uses: actions/checkout@v7
        with:
          ref: refs/heads/master
          persist-credentials: false

      - name: Download new tool entries as data
        id: tools
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/pr-check/data/tools"
          gh api --paginate --slurp "repos/$GH_REPO/pulls/$PR_NUMBER/files" > "$RUNNER_TEMP/pr-check/files.json"
          jq -r '.[][] | select(.status == "added") | select(.filename | test("^data/tools/[a-zA-Z0-9_.-]+\\.ya?ml$")) | [.sha, .filename] | @tsv' \
            "$RUNNER_TEMP/pr-check/files.json" > "$RUNNER_TEMP/pr-check/tools.tsv"
          if jq -e 'any(.[][]; .filename == "README.md" or .previous_filename == "README.md")' "$RUNNER_TEMP/pr-check/files.json" > /dev/null; then
            echo "readme_changed=true" >> "$GITHUB_OUTPUT"
          fi
          while IFS=$'\t' read -r sha file; do
            gh api "repos/$HEAD_REPO/git/blobs/$sha" --jq .content | base64 --decode \
              > "$RUNNER_TEMP/pr-check/$file"
          done < "$RUNNER_TEMP/pr-check/tools.tsv"
          if [ -s "$RUNNER_TEMP/pr-check/tools.tsv" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust toolchain
        if: steps.tools.outputs.found == 'true'
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.98.1

      - name: Build trusted checker
        if: steps.tools.outputs.found == 'true'
        run: cargo build --release --locked --manifest-path ci/Cargo.toml -p pr-check

      - name: Check tool criteria
        if: steps.tools.outputs.found == 'true'
        id: check
        working-directory: ${{ runner.temp }}/pr-check
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMMENT_OUTPUT_FILE: ${{ runner.temp }}/pr-check/comment.md
        shell: bash
        run: |
          shopt -s nullglob dotglob
          files=(data/tools/*.yml data/tools/*.yaml)
          [ "${#files[@]}" -gt 0 ]
          status=0
          "$GITHUB_WORKSPACE/ci/target/release/pr-check" "${files[@]}" || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Report README check
        env:
          TOOLS_FOUND: ${{ steps.tools.outputs.found }}
          README_CHANGED: ${{ steps.tools.outputs.readme_changed }}
        run: |
          if [ "$TOOLS_FOUND" != 'true' ]; then
            printf 'No new tool entries to check.\n' > "$RUNNER_TEMP/pr-check/comment.md"
          elif [ ! -s "$RUNNER_TEMP/pr-check/comment.md" ]; then
            printf 'Tool criteria checks could not complete. Please inspect the workflow logs, fix any errors, and rerun the check.\n' > "$RUNNER_TEMP/pr-check/comment.md"
          fi
          if [ "$README_CHANGED" != 'true' ]; then
            exit 0
          fi
          cat >> "$RUNNER_TEMP/pr-check/comment.md" <<'EOF'

          ## [FAIL] Generated README changed

          `README.md` is generated and should not be included in tool submissions. Please remove its changes from this PR and submit tool entries under `data/tools/` instead. For changes to the README text or structure, edit `ci/crates/render/templates/README.md` rather than the generated file.

          This check will remain failed until the `README.md` changes are removed. README changes alone do not automatically close the PR.
          EOF

      - name: Check PR is still current
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh pr view "$PR_NUMBER" --json state,headRefOid --jq '[.state, .headRefOid] | join(" ")')
          if [ "$current" = "OPEN $HEAD_SHA" ] && [ -s "$RUNNER_TEMP/pr-check/comment.md" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Post or update PR comment
        if: steps.current.outputs.ready == 'true'
        id: comment
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          number: ${{ env.PR_NUMBER }}
          path: ${{ runner.temp }}/pr-check/comment.md
          header: pr-check-bot
          # Clear obsolete warnings without adding comments to unrelated PRs.
          only_update: ${{ steps.tools.outputs.found != 'true' && steps.tools.outputs.readme_changed != 'true' }}

      - name: Close verified rejections
        if: steps.comment.outcome == 'success' && steps.check.outputs.status == '2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh pr view "$PR_NUMBER" --json state,headRefOid --jq '[.state, .headRefOid] | join(" ")')
          if [ "$current" = "OPEN $HEAD_SHA" ]; then
            gh pr close "$PR_NUMBER"
          fi

      - name: Fail if checks did not pass
        if: steps.tools.outputs.found == 'true' || steps.tools.outputs.readme_changed == 'true'
        env:
          CHECK_STATUS: ${{ steps.check.outputs.status || '0' }}
          README_CHANGED: ${{ steps.tools.outputs.readme_changed }}
        run: test "$CHECK_STATUS" = '0' && test "$README_CHANGED" != 'true'
